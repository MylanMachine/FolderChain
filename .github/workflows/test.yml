name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./internal/... -count=1 -timeout 600s
      - run: go build -trimpath -ldflags "-H windowsgui -s -w" -o FolderChain.exe .
